apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: operations-portal

resources:
- namespace.yaml
- configmap.yaml
- secret.yaml
- deployment.yaml
- service.yaml
- ingress.yaml
- hpa.yaml
- networkpolicy.yaml
- pdb.yaml

commonLabels:
  app: operations-portal
  version: v1.0.0
  environment: production

patchesStrategicMerge:
- |-
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: operations-portal
  spec:
    template:
      spec:
        containers:
        - name: operations-portal
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
