apiVersion: v1
kind: ConfigMap
metadata:
  name: operations-portal-config
  namespace: operations-portal
  labels:
    app: operations-portal
data:
  # Environment variables
  NODE_ENV: "production"
  REACT_APP_API_BASE_URL: "http://api-gateway:8080"
  REACT_APP_AUTH_SERVICE_URL: "http://auth-service:8080"
  REACT_APP_OPERATIONS_SERVICE_URL: "http://operations-management-service:8080"
  REACT_APP_PAYMENT_SERVICE_URL: "http://payment-initiation-service:8080"
  REACT_APP_TRANSACTION_SERVICE_URL: "http://transaction-processing-service:8080"
  REACT_APP_RECONCILIATION_SERVICE_URL: "http://reconciliation-service:8080"
  
  # Feature flags
  REACT_APP_ENABLE_ANALYTICS: "true"
  REACT_APP_ENABLE_DEBUG: "false"
  REACT_APP_ENABLE_MOCK_DATA: "false"
  
  # Performance settings
  REACT_APP_CACHE_TTL: "300000"
  REACT_APP_REQUEST_TIMEOUT: "30000"
  REACT_APP_RETRY_ATTEMPTS: "3"
  
  # Security settings
  REACT_APP_ENABLE_HTTPS: "true"
  REACT_APP_SESSION_TIMEOUT: "3600000"
  
  # Monitoring
  REACT_APP_ENABLE_MONITORING: "true"
  REACT_APP_METRICS_ENDPOINT: "/metrics"
