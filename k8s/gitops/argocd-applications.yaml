# =============================================================================
# ARGOCD APPLICATIONS FOR ALL SERVICES
# =============================================================================
# GitOps applications for automated deployments

# =============================================================================
# PAYMENTS ENGINE APPLICATIONS
# =============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payment-initiation-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/company/payments-engine
    targetRevision: HEAD
    path: k8s/deployments/payment-initiation-service
  destination:
    server: https://kubernetes.default.svc
    namespace: payments
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

