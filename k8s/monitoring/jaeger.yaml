# =============================================================================
# PRODUCTION-READY JAEGER DISTRIBUTED TRACING
# =============================================================================
# Advanced distributed tracing with OpenTelemetry integration

apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: monitoring
  labels:
    app: jaeger
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.50
          ports:
            - containerPort: 16686
              name: ui
            - containerPort: 14268
              name: http
            - containerPort: 14250
              name: grpc
            - containerPort: 4317
              name: otlp-http
            - containerPort: 4318
              name: otlp-grpc
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            - name: SPAN_STORAGE_TYPE
              value: "elasticsearch"
            - name: ES_SERVER_URLS
              value: "http://elasticsearch:9200"
            - name: ES_INDEX_PREFIX
              value: "jaeger"
            - name: ES_TAGS_AS_FIELDS_ALL
              value: "true"
            - name: SAMPLING_STRATEGIES_FILE
              value: "/etc/jaeger/sampling.json"
          volumeMounts:
            - name: jaeger-config
              mountPath: /etc/jaeger
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 30
            timeoutSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 30
            timeoutSeconds: 30
      volumes:
        - name: jaeger-config
          configMap:
            name: jaeger-config

---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: monitoring
  labels:
    app: jaeger
spec:
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
      protocol: TCP
    - name: http
      port: 14268
      targetPort: 14268
      protocol: TCP
    - name: grpc
      port: 14250
      targetPort: 14250
      protocol: TCP
    - name: otlp-http
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-grpc
      port: 4318
      targetPort: 4318
      protocol: TCP
  type: ClusterIP

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-config
  namespace: monitoring
data:
  sampling.json: |
    {
      "service_strategies": [
        {
          "service": "payment-initiation-service",
          "type": "probabilistic",
          "param": 0.1
        },
        {
          "service": "validation-service",
          "type": "probabilistic",
          "param": 0.1
        },
        {
          "service": "transaction-processing-service",
          "type": "probabilistic",
          "param": 0.05
        },
        {
          "service": "saga-orchestrator",
          "type": "probabilistic",
          "param": 0.1
        }
      ],
      "default_strategy": {
        "type": "probabilistic",
        "param": 0.01
      }
    }
