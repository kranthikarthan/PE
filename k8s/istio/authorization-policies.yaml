apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: validation-service-authz
  namespace: payments
spec:
  selector:
    matchLabels:
      app: validation-service
  rules:
    # Allow specific services to call validation
    - from:
        - source:
            principals: ["cluster.local/ns/payments/sa/payment-initiation-service"]
        - source:
            principals: ["cluster.local/ns/payments/sa/transaction-processing-service"]
        - source:
            principals: ["cluster.local/ns/payments/sa/routing-service"]
      to:
        - operation:
            methods: ["POST"]
            paths: ["/api/v1/validation/*"]

