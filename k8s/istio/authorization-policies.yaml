# =============================================================================
# PRODUCTION-READY ISTIO AUTHORIZATION POLICIES
# =============================================================================
# Comprehensive security policies for all 22 services with fine-grained access control

# Payment Initiation Service
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: payment-initiation-service-authz
  namespace: payments
spec:
  selector:
    matchLabels:
      app: payment-initiation-service
  rules:
    # Allow external access to payment initiation
    - from:
        - source:
            namespaces: ["istio-system"]
        - source:
            principals: ["cluster.local/ns/payments/sa/web-bff-service"]
      to:
        - operation:
            methods: ["GET", "POST"]
            paths: ["/api/v1/payments/*"]
    # Allow internal service calls
    - from:
        - source:
            principals: ["cluster.local/ns/payments/sa/validation-service"]
        - source:
            principals: ["cluster.local/ns/payments/sa/transaction-processing-service"]
        - source:
            principals: ["cluster.local/ns/payments/sa/saga-orchestrator"]
      to:
        - operation:
            methods: ["GET", "POST", "PUT"]
            paths: ["/api/v1/payments/*"]

---
