---
# Platform Services
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: iam-service-authz
  namespace: payments
spec:
  selector:
    matchLabels:
      app: iam-service
  rules:
    # Allow all services to call IAM for authentication
    - from:
        - source:
            principals: ["cluster.local/ns/payments/sa/*"]
      to:
        - operation:
            methods: ["GET", "POST"]
            paths: ["/api/v1/auth/*", "/api/v1/users/*"]
    # Allow external access for authentication
    - from:
        - source:
            namespaces: ["istio-system"]
      to:
        - operation:
            methods: ["POST"]
            paths: ["/api/v1/auth/login", "/api/v1/auth/refresh"]

---
