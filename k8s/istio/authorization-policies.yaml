    - from:
        - source:
            namespaces: ["istio-system"]
      to:
        - operation:
            methods: ["GET", "POST", "PUT", "DELETE"]
            paths: ["/api/v1/*"]
    # Allow web BFF to call all other services
    - to:
        - operation:
            methods: ["GET", "POST", "PUT", "DELETE"]
            paths: ["/api/v1/*"]

---
# =============================================================================
# DENY ALL BY DEFAULT POLICY
# =============================================================================
# This policy ensures that any service not explicitly allowed is denied access

apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: deny-all-default
  namespace: payments
spec:
  # This policy applies to all services by default
  rules: []
  # Empty rules means deny all
