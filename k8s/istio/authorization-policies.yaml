            paths: ["/api/v1/audit/*"]
    # Allow read access for audit queries
    - from:
        - source:
            principals: ["cluster.local/ns/payments/sa/iam-service"]
        - source:
            principals: ["cluster.local/ns/payments/sa/tenant-management-service"]
      to:
