# =============================================================================
# PRODUCTION-READY ISTIO DESTINATION RULES
# =============================================================================
# Comprehensive circuit breaker and load balancing policies for all services

# Payment Initiation Service
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: payment-initiation-service
  namespace: payments
spec:
  host: payment-initiation-service
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 200
        connectTimeout: 10s
      http:
        http1MaxPendingRequests: 100
        http2MaxRequests: 200
        maxRequestsPerConnection: 4
        maxRetries: 3
        consecutiveGatewayErrors: 5
        interval: 30s
        baseEjectionTime: 30s
        maxEjectionPercent: 50
        minHealthPercent: 30
    outlierDetection:
      consecutiveErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 30
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2

