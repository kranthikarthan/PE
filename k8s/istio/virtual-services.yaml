# =============================================================================
# CANARY DEPLOYMENT CONFIGURATIONS
# =============================================================================

# Payment Service Canary (90/10 split)
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: payment-initiation-service-canary
  namespace: payments
spec:
  hosts:
    - payment-initiation-service
  http:
    - match:
        - headers:
            canary:
              exact: "true"
      route:
        - destination:
            host: payment-initiation-service
            subset: v2
          weight: 100
    - route:
        - destination:
            host: payment-initiation-service
            subset: v1
          weight: 90
        - destination:
            host: payment-initiation-service
            subset: v2
          weight: 10
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s
      retryOn: 5xx,reset,connect-failure

---
# Transaction Processing Service Canary (50/50 split)
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: transaction-processing-service-canary
  namespace: payments
spec:
  hosts:
    - transaction-processing-service
  http:
    - match:
        - headers:
            canary:
              exact: "true"
      route:
        - destination:
            host: transaction-processing-service
            subset: v2
          weight: 100
    - route:
        - destination:
            host: transaction-processing-service
            subset: v1
          weight: 50
        - destination:
            host: transaction-processing-service
            subset: v2
          weight: 50
    timeout: 60s
    retries:
      attempts: 3
      perTryTimeout: 20s
      retryOn: 5xx,reset,connect-failure
