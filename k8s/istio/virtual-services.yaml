# =============================================================================
# PRODUCTION-READY ISTIO VIRTUAL SERVICES
# =============================================================================
# Comprehensive traffic routing for all 22 services with advanced features

# Payment Initiation Service
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: payment-initiation-service
  namespace: payments
spec:
  hosts:
    - payment-initiation-service
  http:
    - match:
        - headers:
            canary:
              exact: "true"
      route:
        - destination:
            host: payment-initiation-service
            subset: v2
          weight: 100
    - route:
        - destination:
            host: payment-initiation-service
            subset: v1
          weight: 100
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s
      retryOn: 5xx,reset,connect-failure,refused-stream

