# =============================================================================
# 14 CUSTOM KUBERNETES OPERATORS
# =============================================================================
# Automated resource management for all services

# =============================================================================
# PAYMENT OPERATOR
# =============================================================================

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: payments.payments.engine.io
spec:
  group: payments.engine.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                serviceName:
                  type: string
                replicas:
                  type: integer
                resources:
                  type: object
                environment:
                  type: string
                features:
                  type: array
                  items:
                    type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
                lastUpdated:
                  type: string
  scope: Namespaced
  names:
    plural: payments
    singular: payment
    kind: Payment

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-operator
  namespace: operators
  labels:
    app: payment-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-operator
  template:
    metadata:
      labels:
        app: payment-operator
    spec:
      serviceAccountName: payments-engine-operator
      containers:
        - name: payment-operator
          image: payments-engine/payment-operator:v1.0.0
          env:
            - name: WATCH_NAMESPACE
              value: "payments"
            - name: OPERATOR_NAME
              value: "payment-operator"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"

