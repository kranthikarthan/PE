# =============================================================================
# KUBERNETES OPERATOR FRAMEWORK SETUP
# =============================================================================
# Foundation for 14 custom operators

apiVersion: v1
kind: Namespace
metadata:
  name: operators
  labels:
    name: operators

---
# =============================================================================
# OPERATOR SDK DEPLOYMENT
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator-sdk
  namespace: operators
  labels:
    app: operator-sdk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: operator-sdk
  template:
    metadata:
      labels:
        app: operator-sdk
    spec:
      containers:
        - name: operator-sdk
          image: quay.io/operator-framework/operator-sdk:v1.32.0
          ports:
            - containerPort: 8080
              name: metrics
          env:
            - name: WATCH_NAMESPACE
              value: "payments,monitoring,feature-flags"
            - name: OPERATOR_NAME
              value: "payments-engine-operator"
            - name: OPERATOR_VERSION
              value: "1.0.0"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "300m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            timeoutSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 30
            timeoutSeconds: 30

---
# =============================================================================
# OPERATOR SERVICE ACCOUNT
# =============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: payments-engine-operator
  namespace: operators

---
# =============================================================================
# OPERATOR RBAC
# =============================================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: payments-engine-operator
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "persistentvolumeclaims", "events", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors"]
    verbs: ["get", "create"]
  - apiGroups: ["apps"]
    resources: ["deployments/finalizers"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: payments-engine-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: payments-engine-operator
subjects:
  - kind: ServiceAccount
    name: payments-engine-operator
    namespace: operators

---
# =============================================================================
# OPERATOR SERVICE
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: payments-engine-operator
  namespace: operators
  labels:
    app: payments-engine-operator
spec:
  selector:
    app: operator-sdk
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
