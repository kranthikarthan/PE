# Account Adapter Service Docker Configuration
spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/account_adapter
    username: payments_user
    password: payments_password
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true

management:
  server:
    port: 18083
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

spring:
  security:
    oauth2:
      client:
        enabled: false
