apiVersion: v1
kind: Service
metadata:
  name: operations-portal-service
  namespace: operations-portal
  labels:
    app: operations-portal
spec:
  selector:
    app: operations-portal
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: operations-portal-nodeport
  namespace: operations-portal
  labels:
    app: operations-portal
spec:
  selector:
    app: operations-portal
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
    nodePort: 30080
  type: NodePort
