apiVersion: v1
kind: Secret
metadata:
  name: operations-portal-secret
  namespace: operations-portal
  labels:
    app: operations-portal
type: Opaque
data:
  # Base64 encoded secrets
  # JWT_SECRET: <base64-encoded-jwt-secret>
  # API_KEY: <base64-encoded-api-key>
  # ENCRYPTION_KEY: <base64-encoded-encryption-key>
  
  # Example (replace with actual base64 encoded values):
  JWT_SECRET: "bXlqd3RzZWNyZXRrZXk="  # myjwtsecretkey
  API_KEY: "bXlhcGlrZXk="  # myapikey
  ENCRYPTION_KEY: "bXllbmNyeXB0aW9ua2V5"  # myencryptionkey
