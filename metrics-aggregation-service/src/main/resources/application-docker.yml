spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/payments_metrics
    username: ${DB_USERNAME:payments}
    password: ${DB_PASSWORD:payments}
  
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:}

app:
  notifications:
    email:
      smtp-host: ${SMTP_HOST:mailhog}
      smtp-port: ${SMTP_PORT:1025}
    slack:
      webhook-url: ${SLACK_WEBHOOK_URL:}
    webhook:
      url: ${WEBHOOK_URL:}
