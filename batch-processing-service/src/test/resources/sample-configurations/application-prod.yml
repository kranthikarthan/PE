# Production Configuration for Batch Processing Service
spring:
  profiles:
    active: prod
  
  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres-cluster}:${DB_PORT:5432}/${DB_NAME:payment_engine_batch}
    username: ${DB_USERNAME:batch_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        connection:
          provider_disables_autocommit: true
  
  # Redis Configuration
  redis:
    host: ${REDIS_HOST:redis-cluster}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD}
    database: 0
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 3000ms
  
  # Batch Configuration
  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: true
  
  # Cloud Configuration
  cloud:
    vault:
      enabled: true
      host: ${VAULT_HOST:vault-server}
      port: ${VAULT_PORT:8200}
      scheme: https
      authentication: TOKEN
      token: ${VAULT_TOKEN}
      kv:
        enabled: true
        backend: secret
        application-name: batch-processing
  
  # Security Configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI}
          jwk-set-uri: ${JWT_JWK_SET_URI}

# Batch Processing Configuration
batch:
  processing:
    chunk-size: ${BATCH_CHUNK_SIZE:1000}
    page-size: ${BATCH_PAGE_SIZE:50}
    timeout-seconds: ${BATCH_TIMEOUT:7200}
    retry-count: ${BATCH_RETRY_COUNT:3}
    max-concurrent-executions: ${BATCH_MAX_CONCURRENT:10}
    async: ${BATCH_ASYNC:false}
    
  # SFTP Configuration
  sftp:
    host: ${SFTP_HOST}
    port: ${SFTP_PORT:22}
    username: ${SFTP_USERNAME}
    password: ${SFTP_PASSWORD}
    private-key-path: ${SFTP_PRIVATE_KEY_PATH}
    known-hosts-file: ${SFTP_KNOWN_HOSTS_FILE}
    connection-pool:
      max-connections: ${SFTP_MAX_CONNECTIONS:10}
      max-idle-time: ${SFTP_MAX_IDLE_TIME:300000}
      connection-timeout: ${SFTP_CONNECTION_TIMEOUT:30000}
      socket-timeout: ${SFTP_SOCKET_TIMEOUT:30000}

# Logging Configuration
logging:
  level:
    com.payments.batch: INFO
    org.springframework.batch: WARN
    org.springframework.jdbc: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.springframework.web: INFO
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId},%X{spanId}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId},%X{spanId}] %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE_PATH:/app/logs}/batch-processing.log
    max-size: 100MB
    max-history: 30
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB

# Management Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,configprops
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
    info:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
        batch.job.executions: true
        batch.job.records.processed: true
    tags:
      application: batch-processing
      environment: production
  tracing:
    sampling:
      probability: 0.1

# Security Configuration
security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 3600
    refresh-expiration: 86400
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://payments.company.com}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true

# Monitoring Configuration
monitoring:
  prometheus:
    enabled: true
    endpoint: /actuator/prometheus
  grafana:
    enabled: true
    dashboard-path: /actuator/grafana
  jaeger:
    enabled: true
    endpoint: ${JAEGER_ENDPOINT:http://jaeger:14268/api/traces}

# Performance Configuration
performance:
  thread-pool:
    core-size: 10
    max-size: 50
    queue-capacity: 100
    keep-alive: 60s
  connection-pool:
    max-total: 100
    max-idle: 20
    min-idle: 5
    max-wait: 3000ms
  cache:
    ttl: 3600s
    max-size: 10000

# Alerting Configuration
alerting:
  enabled: true
  webhook-url: ${ALERT_WEBHOOK_URL}
  channels:
    - email
    - slack
    - pagerduty
  rules:
    - name: "High Error Rate"
      condition: "error_rate > 0.05"
      duration: "5m"
      severity: "warning"
    - name: "High Memory Usage"
      condition: "memory_usage > 0.8"
      duration: "2m"
      severity: "critical"
    - name: "Job Execution Timeout"
      condition: "job_duration > 7200"
      duration: "1m"
      severity: "critical"

# Backup Configuration
backup:
  enabled: true
  schedule: "0 2 * * *"
  retention-days: 30
  storage:
    type: s3
    bucket: ${BACKUP_S3_BUCKET}
    region: ${BACKUP_S3_REGION}
    access-key: ${BACKUP_S3_ACCESS_KEY}
    secret-key: ${BACKUP_S3_SECRET_KEY}
