spring:
  config:
    import: "optional:configserver:,optional:consul:"
  cloud:
    config:
      import-check:
        enabled: false
    vault:
      enabled: false
  batch:
    jdbc:
      initialize-schema: never
  datasource:
    url: jdbc:tc:postgresql:15:///testdb
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false

logging:
  level:
    root: INFO

