server:
  port: 8021

spring:
  application:
    name: operations-management-service
  
  datasource:
    url: jdbc:postgresql://localhost:5432/payments_operations
    username: ${DB_USERNAME:payments}
    password: ${DB_PASSWORD:payments}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# Operations Management Configuration
app:
  kubernetes:
    namespace: ${K8S_NAMESPACE:payments}
    config-path: ${K8S_CONFIG_PATH:}
  
  services:
    actuator-port: ${ACTUATOR_PORT:8080}
  
  unleash:
    api-url: ${UNLEASH_API_URL:http://unleash:4242/api}
    app-name: ${UNLEASH_APP_NAME:operations-management-service}
    instance-id: ${UNLEASH_INSTANCE_ID:operations-management-001}
    api-token: ${UNLEASH_API_TOKEN:}

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# Logging
logging:
  level:
    com.payments.operationsmanagement: INFO
    io.kubernetes.client: WARN
    io.getunleash: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
